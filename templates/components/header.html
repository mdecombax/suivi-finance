{%- from 'components/nav_items.html' import nav_items -%}
<!-- Header Navigation -->
<header class="animate-fadeInDown">
    <div class="header-content">
        <a href="/" class="logo animate-slideInLeft" aria-label="Finolio — accueil">
            <img src="/static/images/logo.png" alt="" class="logo-icon">
            <div class="logo-text">Finolio</div>
        </a>

        <nav class="nav animate-slideInRight" aria-label="Navigation principale">
            {%- for key, href, label, icon in nav_items %}
            <a href="{{ href }}" class="nav-link {% if active_page == key %}active{% endif %}"{% if active_page == key %} aria-current="page"{% endif %}>{{ label }}</a>
            {%- endfor %}
        </nav>

        <div class="header-controls">
            <!-- Avatar utilisateur -->
            {% include 'components/user_dropdown.html' %}
        </div>
    </div>
</header>

{% include 'components/tab_bar.html' %}
